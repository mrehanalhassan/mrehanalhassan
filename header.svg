<path d="M0,172 Q80,158 160,172 T320,172 T480,172 T640,172 T800,172 T960,172 T1120,172 T1280,172 T1440,172 T1600,172 T1760,172 T1920,172 T2080,172 T2240,172 T2400,172 T2560,172 L2560,220 L0,220 Z" fill="#D4AF37"/>
</g>
<circle cx="200" cy="200" r="4" fill="#2563EB" opacity="0">
