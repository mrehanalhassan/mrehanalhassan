<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="220" viewBox="0 0 1280 220" role="img" aria-label="Decorative animated header">
<title>Decorative animated header</title>
<defs>
<linearGradient id="hsheen" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
<stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
<stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
<animateTransform attributeName="gradientTransform" type="translate" values="-1.8 0; 1.8 0" dur="8s" repeatCount="indefinite"/>
</linearGradient>
</defs>
<rect width="1280" height="220" fill="#05070D"/>
<g opacity="0.30">
