<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">M Rehan Al Hassan — Digital Builder</title><desc id="desc">A custom-coded cinematic blue and gold interface with animated orbital nodes and a digital grid.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05070D"/><stop offset=".55" stop-color="#09182D"/><stop offset="1" stop-color="#07101E"/></linearGradient>
 <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563FF" stop-opacity="0"/><stop offset=".5" stop-color="#4DA3FF"/><stop offset="1" stop-color="#D4AF62" stop-opacity="0"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#2563FF" stop-opacity=".32"/><stop offset="1" stop-color="#2563FF" stop-opacity="0"/></radialGradient>
