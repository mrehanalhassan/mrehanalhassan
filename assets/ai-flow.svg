<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="184" viewBox="0 0 1200 184" role="img" aria-labelledby="title desc">
<title id="title">AI automation workflow</title><desc id="desc">Animated code-based infographic showing an input moving through AI processing and automation into an output.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070B13"/><stop offset="1" stop-color="#0B1C34"/></linearGradient><linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563FF"/><stop offset=".55" stop-color="#4DA3FF"/><stop offset="1" stop-color="#D4AF62"/></linearGradient></defs>
<rect width="1200" height="184" rx="18" fill="url(#bg)" stroke="#1D3556"/>
<text x="28" y="32" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="2.4" fill="#D4AF62">AI AUTOMATION / FROM INPUT TO OUTCOME</text>
<path d="M182 103H1018" stroke="#1A3150" stroke-width="4" stroke-linecap="round"/><path d="M182 103H1018" stroke="url(#path)" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="0;-88" dur="3.2s" repeatCount="indefinite"/></path>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
<rect x="62" y="68" width="220" height="70" rx="13" fill="#0B2342" stroke="#2563FF"/><text x="172" y="96" font-size="14" font-weight="700" fill="#FFFFFF">01 / INPUT</text><text x="172" y="117" font-size="11" fill="#9FC8FF">Data · Request · Trigger</text>
<rect x="342" y="68" width="220" height="70" rx="13" fill="#0D1D32" stroke="#4DA3FF"/><text x="452" y="96" font-size="14" font-weight="700" fill="#FFFFFF">02 / AI PROCESS</text><text x="452" y="117" font-size="11" fill="#B5D7FF">Interpret · Organize</text>
<rect x="622" y="68" width="220" height="70" rx="13" fill="#171E2A" stroke="#4DA3FF"/><text x="732" y="96" font-size="14" font-weight="700" fill="#FFFFFF">03 / AUTOMATE</text><text x="732" y="117" font-size="11" fill="#B5D7FF">Workflow · Action</text>
<rect x="902" y="68" width="220" height="70" rx="13" fill="#201D18" stroke="#D4AF62"/><text x="1012" y="96" font-size="14" font-weight="700" fill="#FFFFFF">04 / OUTPUT</text><text x="1012" y="117" font-size="11" fill="#F2D99E">Useful result</text>
</g>
<circle r="5" fill="#FFFFFF" stroke="#4DA3FF" stroke-width="2"><animateMotion dur="4.5s" repeatCount="indefinite" path="M172 103 H1012"/></circle>
</svg>